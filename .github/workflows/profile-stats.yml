name: Profile stats

# Regenerates the SVG cards in the profile README from the GitHub API and
# publishes them to the `output` branch, so the README never depends on
# third-party card services.

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/profile_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore last published cards
        # Start from the previous output so a temporarily failing source
        # (WakaTime, Stack Overflow) keeps its last good card.
        run: |
          mkdir -p dist
          if git fetch -q --depth 1 origin output; then
            git --work-tree=dist checkout FETCH_HEAD -- .
          fi

      - name: Render cards
        env:
          # Optional: a classic PAT with read:user in the STATS_TOKEN secret
          # also counts private contributions. Falls back to the built-in token.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          # Optional: WakaTime API key (wakatime.com/settings/api-key) for the
          # coding-time card. Without it the public stats of the user id are tried.
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: >-
          python3 scripts/profile_stats.py
          --user "${{ github.repository_owner }}"
          --stackoverflow 12537452
          --wakatime-user 5394cf5d-8882-4e01-809d-145c95c39fa9
          --out dist

      - name: Publish to output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Update profile stats"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" output
